services:
  - type: web
    name: securetrade-api
    runtime: node
    plan: free
    rootDir: services/api
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: securetrade-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: CORS_ORIGIN
        sync: false
      # Seeded on start (see src/seed.ts). Reveal the generated password in the Render dashboard.
      - key: ADMIN_EMAIL
        value: admin@securetrade.local
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: securetrade-db
    plan: free
    databaseName: securetrade
    user: securetrade
