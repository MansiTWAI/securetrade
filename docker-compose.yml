services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securetrade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://postgres:change-me@db:5432/securetrade
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost
    depends_on: [db, redis]
    ports: ["4000:4000"]
volumes:
  pgdata:
